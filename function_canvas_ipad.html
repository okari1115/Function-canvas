<style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#1a2940;--muted:#708097;--line:#dce4ee;--blue:#356dd8;--bluebg:#e9f1ff;--purple:#8559c5;--purplebg:#f2ebfc;--green:#16836f;--greenbg:#e7f7f0;--shadow:0 8px 30px rgba(28,45,71,.08)}
*{box-sizing:border-box}body{margin:0;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}header{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 24px;justify-content:space-between}header .brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{background:#1c355c;color:#fff;border-radius:13px;width:42px;height:42px;display:grid;place-items:center;font-weight:800;font-size:24px}.brand h1{font-size:18px;margin:0;letter-spacing:-.02em}.brand p{font-size:12px;color:var(--muted);margin:4px 0 0}.header-actions,.toolbar-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:#263650;padding:9px 13px;border-radius:9px;font-size:12px;font-weight:700;white-space:nowrap}.btn:hover{border-color:#9db6e8;background:#f7faff}.btn.primary{background:#2c65d0;border-color:#2c65d0;color:white}.btn.primary:hover{background:#2057be}.btn.active{background:#fff4db;border-color:#edb750;color:#785219}.btn.danger{color:#b13c48}.btn.ghost{background:transparent}.btn.small{padding:6px 9px}.app{height:calc(100vh - 76px);display:grid;grid-template-columns:minmax(0,1fr) 365px}.main{min-width:0;display:flex;flex-direction:column}.toolbar{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}.canvas-wrap{flex:1;position:relative;overflow:auto;background-color:#f7f9fc;background-image:radial-gradient(#d6dfea 1px,transparent 1px);background-size:20px 20px;scrollbar-color:#c2cedd transparent}.canvas-hint{position:sticky;top:12px;left:14px;z-index:4;pointer-events:none;display:inline-block;background:rgba(255,255,255,.94);border:1px solid #e4e9f1;border-radius:8px;padding:8px 12px;font-size:12px;color:#65768c;box-shadow:0 3px 12px #1d2d4711}.world-shell{position:relative;min-width:100%;min-height:100%}.world{position:absolute;left:0;top:0;width:2600px;height:1900px;transform-origin:top left}.edges{position:absolute;left:0;top:0;width:2600px;height:1900px;overflow:visible;pointer-events:none}.edge-group{pointer-events:visibleStroke;cursor:pointer}.edge-path{fill:none;stroke:#8798ac;stroke-width:2.2;pointer-events:none}.edge-group.selected .edge-path{stroke:#d78719;stroke-width:3}.edge-group.kind-state .edge-path{stroke:var(--purple);stroke-dasharray:7 6}.edge-hit{stroke:transparent;stroke-width:18;fill:none;pointer-events:stroke}.node{position:absolute;width:266px;min-height:136px;border:1px solid #b7cbe9;border-radius:12px;background:#fff;box-shadow:0 5px 20px rgba(19,48,88,.09);cursor:grab;user-select:none;overflow:hidden}.node:active{cursor:grabbing}.node.selected{outline:3px solid #74a3ff;outline-offset:2px}.node.connect-origin{outline:3px solid #e3ab45;outline-offset:2px}.node.type-control{border-top:5px solid #5489e8}.node.type-output{border-top:5px solid #43ab7e}.node.type-state{border-top:5px solid #a47ad8}.node-head{padding:12px 14px 6px;display:flex;align-items:center;gap:7px}.node-name{font-size:15px;font-weight:800;line-height:1.3;overflow-wrap:anywhere}.node-type{margin-left:auto;color:#60738d;background:#edf2f9;padding:3px 7px;font-size:10px;border-radius:5px;white-space:nowrap}.node.type-output .node-type{color:var(--green);background:var(--greenbg)}.node.type-state .node-type{color:var(--purple);background:var(--purplebg)}.node-body{padding:4px 14px 13px;line-height:1.55}.node-resp{font-size:12px;color:#40516c;white-space:pre-wrap;overflow-wrap:anywhere;max-height:66px;overflow:hidden}.node-input{font-size:11px;color:#8090a3;border-top:1px solid #ecf0f5;margin-top:9px;padding-top:7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.inspector{min-height:0;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column}.inspector-head{padding:19px 22px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.inspector-head h2{margin:0;font-size:17px}.inspector-head p{margin:6px 0 0;color:var(--muted);font-size:12px}.inspector-body{padding:17px 22px 30px;overflow:auto;flex:1}.field{margin-bottom:15px}.field label{display:block;font-size:12px;font-weight:750;color:#3d4d65;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid #d5deeb;border-radius:8px;background:#fff;padding:10px 11px;color:#25344b;outline:none;font-size:13px}.field textarea{resize:vertical;min-height:64px;line-height:1.5}.field input:focus,.field textarea:focus,.field select:focus{border-color:#5289e8;box-shadow:0 0 0 3px #5289e81c}.field-help{font-size:11px;color:#8695a8;margin-top:5px}.inspector-actions{display:flex;gap:7px;padding-top:5px}.empty{padding:44px 20px;text-align:center;color:#8594a8;font-size:13px;line-height:1.8}.empty .em{font-size:32px;display:block;margin-bottom:10px}.section-title{font-size:12px;font-weight:800;color:#6e7e95;margin:20px 0 10px;border-top:1px solid var(--line);padding-top:15px}.connections{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#f0f4fa;border:1px solid #e1e8f1;border-radius:7px;padding:6px 8px;font-size:11px;color:#50647e}.status{position:fixed;bottom:18px;left:20px;background:#1c344f;color:white;padding:10px 14px;border-radius:9px;box-shadow:var(--shadow);font-size:12px;opacity:0;transform:translateY(7px);transition:.2s;pointer-events:none;z-index:20}.status.show{opacity:1;transform:translateY(0)}.help-pill{font-size:11px;color:#8291a6}.file-input{display:none}.footer-note{margin-top:18px;font-size:11px;line-height:1.6;color:#8b98a9}kbd{font-size:10px;border:1px solid #d6dfec;padding:2px 5px;border-radius:4px;background:#f4f7fa;color:#63748b}@media(max-width:900px){header{height:auto;min-height:72px;padding:12px 14px;flex-wrap:wrap}.app{height:calc(100vh - 116px);grid-template-columns:minmax(0,1fr) 310px}.brand p{display:none}}@media(max-width:680px){header{gap:9px}.brand h1{font-size:15px}.app{height:auto;display:flex;flex-direction:column}.main{height:58vh;min-height:430px}.inspector{border-left:none;border-top:1px solid var(--line);min-height:380px}.inspector-body{max-height:none}.toolbar{flex-wrap:wrap}.btn{font-size:11px;padding:8px 9px}}

/* iPad: keep controls accessible without precision dragging */
.mobile-controls{display:flex;flex-wrap:wrap;align-items:end;gap:9px;background:#eef4ff;padding:10px 14px;border-bottom:1px solid #d3e1f5}
.mobile-controls label{font-size:12px;font-weight:700;display:flex;flex-direction:column;gap:4px;flex:1 1 145px}
.mobile-controls select{font-size:16px;border:1px solid #c4d3e9;border-radius:9px;background:#fff;padding:9px;width:100%;max-width:100%}
.mobile-controls .btn{min-height:42px;font-size:13px}
.node{touch-action:none;-webkit-user-select:none}
.canvas-wrap{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
@media(max-width:900px){.main{min-height:470px}.mobile-controls{padding:9px}.inspector-body{padding:14px}.btn{min-height:39px}}
@media(max-width:680px){.main{height:62vh;min-height:510px}.inspector{min-height:380px}.canvas-hint{font-size:11px}}
</style>

<body>
<header><div class="brand"><div class="logo">ƒ</div><div><h1>Function Canvas</h1><p>関数の責務と依存関係を、図で設計する</p></div></div><div class="header-actions"><button class="btn" id="exportBtn">↓ JSON保存</button><button class="btn" id="importBtn">↑ 読み込み</button><input class="file-input" type="file" id="importFile" accept=".json,application/json"/><button class="btn danger" id="resetBtn">サンプルに戻す</button></div></header>
<div class="app"><main class="main"><div class="toolbar"><div class="toolbar-group"><button class="btn primary" id="addBtn">＋ 新しい関数</button><button class="btn" id="connectBtn">↗ 接続する</button><button class="btn" id="layoutBtn">▦ 自動整列</button></div><div class="toolbar-group"><span class="help-pill" id="zoomLabel">100%</span><button class="btn small" id="zoomOut" aria-label="縮小">－</button><button class="btn small" id="zoomIn" aria-label="拡大">＋</button><button class="btn small" id="fitBtn">全体表示</button></div></div><div class="mobile-controls" id="mobileControls">
<label>編集する関数<select id="mobileNodeSelect"><option value="">関数を選択</option></select></label>
<label>接続元<select id="mobileFrom"><option value="">接続元を選択</option></select></label>
<label>接続先<select id="mobileTo"><option value="">接続先を選択</option></select></label>
<label>関係<select id="mobileKind"><option value="call">関数呼び出し →</option><option value="state">状態更新・依存 ⇢</option></select></label>
<button class="btn primary" id="mobileConnect">接続を追加</button>
</div><div class="canvas-wrap" id="canvas"><div class="canvas-hint" id="hint">ノードをドラッグして移動 ・ 選択すると右側で編集できます</div><div class="world-shell" id="shell"><div class="world" id="world"><svg class="edges" id="edges" viewBox="0 0 2600 1900"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#8798ac"/></marker><marker id="arrowState" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#8559c5"/></marker></defs><g id="edgeLayer"></g></svg><div id="nodeLayer"></div></div></div></div></main><aside class="inspector"><div class="inspector-head"><div><h2 id="inspectorTitle">関数設計メモ</h2><p id="inspectorSubtitle">ノードを選ぶと詳細を編集できます</p></div><span style="font-size:22px;color:#a0afc2">☷</span></div><div class="inspector-body" id="inspectorBody"></div></aside></div><div class="status" id="toast" role="status"></div>
<script>
(()=>{'use strict';
const FIELDS=[['name','関数名','例：parse_format'],['responsibility','責務','何を担当する関数か'],['input','入力','引数とその意味'],['changes','変更するもの','状態・メモリ・出力先など'],['unchanged','変更しないもの','維持する必要がある状態'],['dependencies','依存する関数','呼び出す関数'],['preconditions','前提条件','呼び出し元が保証すること'],['contract','契約','成功時・失敗時の振る舞い']];
const WIDTH=266, HEIGHT=150, WORLD_W=2600, WORLD_H=1900;
let nodes=[],edges=[],selected=null,selectedEdge=null,connectFrom=null,connectMode=false,zoom=1,drag=null,dirty=false,saveQueued=false;
const $=id=>document.getElementById(id);
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=> 'n_'+Math.random().toString(36).slice(2,10);
const sample=()=>{
const entries=[
['printf','ft_printf()','可変長引数を準備し、解析を呼び出して結果を返す','const char *format, ...','args、ローカルctx','formatの内容','init_ctx(), parse_format()','formatは有効な文字列','成功時は合計出力文字数、失敗時は-1','control',600,65],
['init','init_ctx()','解析・集計状態を初期化する','t_ctx *ctx','ctx->start、ctx->total_len','その他の状態','なし','ctxが有効','開始位置と累計を0にする','state',260,320],
['parse','parse_format()','書式を走査し、通常文字列と指定子を振り分ける','format, va_list *args, t_ctx *ctx','ctx->start、間接的にtotal_len','formatの内容','flush_text(), parse_specifier(), record_output()','argsとctxが初期化済み','成功時は出力文字数、失敗時は-1','control',720,320],
['flush','flush_text()','通常文字列の未出力範囲をまとめて書き込む','format, ctx, position','出力先','format・ctxの値','all_write()','start ≤ position','出力文字数または-1','output',350,620],
['spec','parse_specifier()','変換指定子を判定し、対応する関数を呼び出す','char c, va_list *args','出力先、引数の読み取り位置','t_ctx','print_xxx(), all_write()','対応する引数の型が正しい','成功時は出力文字数、失敗時は-1','control',1050,620],
['record','record_output()','出力結果を集計し、INT_MAX超過を検査する','t_ctx *ctx, ssize_t output_len','ctx->total_len','ctx->start','なし','0 ≤ total_len ≤ INT_MAX','成功時は更新後累計、失敗時は-1','state',705,895],
['write','all_write()','部分書き込みに対応してバイト列を出力する','int fd, const char *s, size_t len','出力先fd','sの内容','write()','有効なバイト列、len ≤ SSIZE_MAX','成功時は出力文字数、失敗時は-1','output',350,1170],
['print','print_xxx() 群','char / string / int / hex / pointer を変換して出力する','変換対象の値','出力先','解析状態','all_write()','入力型と指定子が対応','成功時は出力文字数、失敗時は-1','output',1100,895]
];return {nodes:entries.map(e=>({id:e[0],name:e[1],responsibility:e[2],input:e[3],changes:e[4],unchanged:e[5],dependencies:e[6],preconditions:e[7],contract:e[8],type:e[9],x:e[10],y:e[11]})),edges:[['printf','init'],['printf','parse'],['parse','flush'],['parse','spec'],['parse','record'],['flush','write'],['spec','print'],['spec','write'],['print','write']].map(([from,to])=>({id:id(),from,to,kind:'call'}))};};
function persist(){try{localStorage.setItem('function-canvas-v1',JSON.stringify({nodes,edges}));}catch(e){}}
function scheduleSave(){if(saveQueued)return;saveQueued=true;setTimeout(()=>{saveQueued=false;persist();},200)}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2300)}
function load(){try{const v=JSON.parse(localStorage.getItem('function-canvas-v1'));if(v&&Array.isArray(v.nodes)&&Array.isArray(v.edges)){nodes=v.nodes;edges=v.edges;return;}}catch(e){}const s=sample();nodes=s.nodes;edges=s.edges;persist()}
function nodeById(nid){return nodes.find(n=>n.id===nid)}
function renderNodes(){const layer=$('nodeLayer');layer.innerHTML='';for(const n of nodes){const el=document.createElement('article');el.className='node type-'+(n.type||'control')+(selected===n.id?' selected':'')+(connectFrom===n.id?' connect-origin':'');el.style.left=n.x+'px';el.style.top=n.y+'px';el.dataset.id=n.id;el.innerHTML='<div class="node-head"><div class="node-name">'+escapeHtml(n.name||'無名関数')+'</div><span class="node-type">'+({control:'制御 / 解析',output:'出力 / 変換',state:'状態管理'}[n.type]||'制御 / 解析')+'</span></div><div class="node-body"><div class="node-resp">'+escapeHtml(n.responsibility||'責務を入力してください')+'</div><div class="node-input">入力：'+escapeHtml(n.input||'未設定')+'</div></div>';el.addEventListener('pointerdown',e=>pointerDown(e,n.id,el));layer.appendChild(el)}}
function pathFor(a,b){let sx,sy,tx,ty;if(b.y>a.y+25){sx=a.x+WIDTH/2;sy=a.y+HEIGHT;tx=b.x+WIDTH/2;ty=b.y;let d=Math.max(45,Math.abs(ty-sy)*.46);return `M ${sx} ${sy} C ${sx} ${sy+d}, ${tx} ${ty-d}, ${tx} ${ty}`;}if(b.y+HEIGHT<a.y-25){sx=a.x+WIDTH/2;sy=a.y;tx=b.x+WIDTH/2;ty=b.y+HEIGHT;let d=Math.max(45,Math.abs(ty-sy)*.46);return `M ${sx} ${sy} C ${sx} ${sy-d}, ${tx} ${ty+d}, ${tx} ${ty}`;}const right=b.x>a.x;sx=a.x+(right?WIDTH:0);sy=a.y+HEIGHT/2;tx=b.x+(right?0:WIDTH);ty=b.y+HEIGHT/2;const d=Math.max(40,Math.abs(tx-sx)*.5);return `M ${sx} ${sy} C ${sx+(right?d:-d)} ${sy}, ${tx+(right?-d:d)} ${ty}, ${tx} ${ty}`;}
function renderEdges(){const layer=$('edgeLayer');layer.innerHTML='';for(const e of edges){const a=nodeById(e.from),b=nodeById(e.to);if(!a||!b)continue;const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','edge-group'+(selectedEdge===e.id?' selected':'')+(e.kind==='state'?' kind-state':''));const d=pathFor(a,b);const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.setAttribute('class','edge-path');p.setAttribute('marker-end',e.kind==='state'?'url(#arrowState)':'url(#arrow)');const hit=document.createElementNS('http://www.w3.org/2000/svg','path');hit.setAttribute('d',d);hit.setAttribute('class','edge-hit');g.append(p,hit);g.addEventListener('click',ev=>{ev.stopPropagation();connectMode=false;connectFrom=null;selected=null;selectedEdge=e.id;renderAll()});layer.appendChild(g)}}
function renderMobile(){
 const choices='<option value="">選択してください</option>'+nodes.map(n=>'<option value="'+escapeHtml(n.id)+'">'+escapeHtml(n.name)+'</option>').join('');
 for(const key of ['mobileNodeSelect','mobileFrom','mobileTo']){
   const el=$(key),value=key==='mobileNodeSelect'?(selected||''):el.value;
   el.innerHTML=choices;el.value=value;
 }
}
function renderAll(){renderEdges();renderNodes();renderInspector();updateToolbar();renderMobile()}
function updateToolbar(){$('connectBtn').classList.toggle('active',connectMode);$('connectBtn').textContent=connectMode?'× 接続を中止':'↗ 接続する';$('hint').textContent=connectMode?(connectFrom?'接続先の関数をクリックしてください':'接続元の関数をクリックしてください'):'関数をタップするか、上の選択欄から選んで編集できます';$('zoomLabel').textContent=Math.round(zoom*100)+'%'}
function fieldControl(key,label,ph,value){const idd='field-'+key;const multiline=['responsibility','preconditions','contract','dependencies'].includes(key);return `<div class="field"><label for="${idd}">${label}</label>${multiline?`<textarea id="${idd}" data-field="${key}" placeholder="${ph}" rows="2">${escapeHtml(value)}</textarea>`:`<input id="${idd}" data-field="${key}" placeholder="${ph}" value="${escapeHtml(value)}" />`}</div>`}
function renderInspector(){let body=$('inspectorBody');if(selectedEdge){const e=edges.find(x=>x.id===selectedEdge);if(!e){selectedEdge=null;return renderInspector()}const a=nodeById(e.from),b=nodeById(e.to);$('inspectorTitle').textContent='接続の編集';$('inspectorSubtitle').textContent='関数同士の関係を設定';body.innerHTML=`<div class="field"><label>接続元</label><div class="chip">${escapeHtml(a?.name||'?')}</div></div><div class="field"><label>接続先</label><div class="chip">${escapeHtml(b?.name||'?')}</div></div><div class="field"><label for="edgeKind">関係の種類</label><select id="edgeKind"><option value="call" ${e.kind!=='state'?'selected':''}>関数呼び出し（実線）</option><option value="state" ${e.kind==='state'?'selected':''}>状態の更新・依存（破線）</option></select></div><button class="btn danger" id="deleteEdge">この接続を削除</button>`;$('edgeKind').onchange=ev=>{e.kind=ev.target.value;scheduleSave();renderEdges()};$('deleteEdge').onclick=()=>{edges=edges.filter(x=>x.id!==e.id);selectedEdge=null;scheduleSave();renderAll();toast('接続を削除しました')};return}
if(!selected){$('inspectorTitle').textContent='関数設計メモ';$('inspectorSubtitle').textContent='ノードを選んで契約を記入';body.innerHTML='<div class="empty"><span class="em">✎</span>ノードをクリックすると<br>「責務・入力・変更するもの・契約」などを<br>編集できます。<br><br>「＋ 新しい関数」で追加、<br>「接続する」で関数をつなげます。</div><div class="section-title">このアプリでできること</div><div class="connections"><span class="chip">ドラッグ移動</span><span class="chip">ノード編集</span><span class="chip">矢印で接続</span><span class="chip">JSON保存・読込</span><span class="chip">自動保存</span></div>';return}
const n=nodeById(selected);if(!n){selected=null;return renderInspector()}$('inspectorTitle').textContent='関数設計メモ';$('inspectorSubtitle').textContent='入力内容は自動保存されます';body.innerHTML=`<div class="field"><label for="typeField">ノードの種類</label><select id="typeField"><option value="control" ${n.type==='control'?'selected':''}>制御・解析（青）</option><option value="output" ${n.type==='output'?'selected':''}>出力・変換（緑）</option><option value="state" ${n.type==='state'?'selected':''}>状態管理（紫）</option></select></div>`+FIELDS.map(([key,label,ph])=>fieldControl(key,label,ph,n[key]||'')).join('')+`<div class="section-title">ノードを移動（タッチ操作向け）</div><div class="inspector-actions"><button class="btn" data-move="left">← 左</button><button class="btn" data-move="up">↑ 上</button><button class="btn" data-move="down">↓ 下</button><button class="btn" data-move="right">右 →</button></div><div class="inspector-actions"><button class="btn" id="duplicateNode">複製</button><button class="btn danger" id="deleteNode">削除</button></div><div class="section-title">接続中の関数</div><div class="connections" id="nodeConnections"></div><div class="footer-note">契約：呼び出し元が信頼できる「成功・失敗時の約束」。内部の処理手順をここに書く必要はありません。</div>`;
body.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('input',ev=>{n[ev.target.dataset.field]=ev.target.value;scheduleSave();renderNodes()}));$('typeField').onchange=ev=>{n.type=ev.target.value;scheduleSave();renderNodes()};body.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const delta={left:[-55,0],right:[55,0],up:[0,-55],down:[0,55]}[b.dataset.move];n.x=Math.max(0,Math.min(WORLD_W-WIDTH,n.x+delta[0]));n.y=Math.max(0,Math.min(WORLD_H-HEIGHT,n.y+delta[1]));scheduleSave();renderNodes();renderEdges()});$('duplicateNode').onclick=()=>{const copy={...n,id:id(),name:n.name+' copy',x:Math.min(WORLD_W-WIDTH,n.x+40),y:Math.min(WORLD_H-HEIGHT,n.y+185)};nodes.push(copy);selected=copy.id;scheduleSave();renderAll();toast('ノードを複製しました')};$('deleteNode').onclick=()=>{if(!confirm('この関数と関連する接続を削除しますか？'))return;edges=edges.filter(e=>e.from!==n.id&&e.to!==n.id);nodes=nodes.filter(x=>x.id!==n.id);selected=null;scheduleSave();renderAll();toast('ノードを削除しました')};const linked=edges.filter(e=>e.from===n.id||e.to===n.id);$('nodeConnections').innerHTML=linked.length?linked.map(e=>`<span class="chip">${e.from===n.id?'→':'←'} ${escapeHtml(nodeById(e.from===n.id?e.to:e.from)?.name||'')}</span>`).join(''):'<span class="help-pill">まだ接続がありません</span>'}
function pointerDown(e,nid,el){if(e.button!==0)return;e.stopPropagation();if(connectMode){if(!connectFrom){connectFrom=nid;renderNodes();updateToolbar()}else if(connectFrom!==nid){if(edges.some(x=>x.from===connectFrom&&x.to===nid)){toast('この接続はすでに存在します')}else{edges.push({id:id(),from:connectFrom,to:nid,kind:'call'});scheduleSave();toast('関数を接続しました')}connectMode=false;connectFrom=null;selected=nid;selectedEdge=null;renderAll()}return}selected=nid;selectedEdge=null;renderAll();const n=nodeById(nid);const startX=e.clientX,startY=e.clientY,ox=n.x,oy=n.y;drag={pointerId:e.pointerId,nid,startX,startY,ox,oy,moved:false};try{$('canvas').setPointerCapture(e.pointerId)}catch(err){}}
window.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pointerId)return;const n=nodeById(drag.nid);if(!n)return;const dx=(e.clientX-drag.startX)/zoom,dy=(e.clientY-drag.startY)/zoom;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;n.x=Math.max(0,Math.min(WORLD_W-WIDTH,drag.ox+dx));n.y=Math.max(0,Math.min(WORLD_H-HEIGHT,drag.oy+dy));const el=[...document.querySelectorAll('.node')].find(x=>x.dataset.id===n.id);if(el){el.style.left=n.x+'px';el.style.top=n.y+'px'}renderEdges()});window.addEventListener('pointerup',e=>{if(drag&&e.pointerId===drag.pointerId){if(drag.moved)scheduleSave();drag=null}});
function setZoom(z){const canvas=$('canvas');const focusX=(canvas.scrollLeft+canvas.clientWidth/2)/zoom,focusY=(canvas.scrollTop+canvas.clientHeight/2)/zoom;zoom=Math.max(.45,Math.min(1.6,Math.round(z*100)/100));$('world').style.transform='scale('+zoom+')';$('shell').style.width=(WORLD_W*zoom)+'px';$('shell').style.height=(WORLD_H*zoom)+'px';canvas.scrollLeft=focusX*zoom-canvas.clientWidth/2;canvas.scrollTop=focusY*zoom-canvas.clientHeight/2;updateToolbar()}
function fit(){if(!nodes.length)return;const canvas=$('canvas');const minX=Math.min(...nodes.map(n=>n.x)),minY=Math.min(...nodes.map(n=>n.y)),maxX=Math.max(...nodes.map(n=>n.x+WIDTH)),maxY=Math.max(...nodes.map(n=>n.y+HEIGHT));const desired=Math.min(1.05,(canvas.clientWidth-100)/(maxX-minX+80),(canvas.clientHeight-80)/(maxY-minY+80));zoom=Math.max(.45,Math.min(1.6,desired));$('world').style.transform=`scale(${zoom})`;$('shell').style.width=(WORLD_W*zoom)+'px';$('shell').style.height=(WORLD_H*zoom)+'px';canvas.scrollLeft=Math.max(0,(minX-45)*zoom);canvas.scrollTop=Math.max(0,(minY-50)*zoom);updateToolbar()}
function layout(){if(!nodes.length)return;const incoming=new Map(nodes.map(n=>[n.id,0]));for(const e of edges)if(incoming.has(e.to))incoming.set(e.to,incoming.get(e.to)+1);let root=nodes.filter(n=>incoming.get(n.id)===0);if(!root.length)root=[nodes[0]];const levels=new Map(),queue=root.map(n=>[n.id,0]);while(queue.length){const [current,depth]=queue.shift();if(levels.has(current))continue;levels.set(current,depth);for(const e of edges.filter(e=>e.from===current))if(!levels.has(e.to))queue.push([e.to,Math.min(depth+1,7)])}for(const n of nodes)if(!levels.has(n.id))levels.set(n.id,Math.max(0,...levels.values())+1);const groups=new Map();for(const n of nodes){let d=levels.get(n.id);if(!groups.has(d))groups.set(d,[]);groups.get(d).push(n)}for(const [depth,arr] of [...groups].sort((a,b)=>a[0]-b[0])){arr.sort((a,b)=>a.x-b.x);const width=arr.length*WIDTH+(arr.length-1)*70;const start=Math.max(40,(Math.max(1300,width+60)-width)/2);arr.forEach((n,i)=>{n.x=Math.min(WORLD_W-WIDTH,start+i*(WIDTH+70));n.y=60+depth*225})}scheduleSave();renderAll();setTimeout(fit,20);toast('関数の階層に沿って配置しました')}
$('mobileNodeSelect').onchange=ev=>{selected=ev.target.value||null;selectedEdge=null;connectMode=false;connectFrom=null;renderAll();if(selected){const n=nodeById(selected);const canvas=$('canvas');canvas.scrollLeft=Math.max(0,(n.x-30)*zoom);canvas.scrollTop=Math.max(0,(n.y-35)*zoom);if(window.matchMedia('(max-width:680px)').matches){$('inspectorTitle').scrollIntoView({behavior:'smooth',block:'start'})}}};
$('mobileConnect').onclick=()=>{const from=$('mobileFrom').value,to=$('mobileTo').value,kind=$('mobileKind').value;if(!from||!to){toast('接続元と接続先を選んでください');return}if(from===to){toast('同じ関数同士は接続できません');return}if(edges.some(e=>e.from===from&&e.to===to)){toast('すでに接続されています');return}edges.push({id:id(),from,to,kind});selected=to;selectedEdge=null;connectMode=false;connectFrom=null;scheduleSave();renderAll();toast('接続を追加しました')};
$('addBtn').onclick=()=>{const canvas=$('canvas');const x=Math.min(WORLD_W-WIDTH,Math.max(25,(canvas.scrollLeft+canvas.clientWidth/2)/zoom-WIDTH/2));const y=Math.min(WORLD_H-HEIGHT,Math.max(25,(canvas.scrollTop+canvas.clientHeight/2)/zoom-HEIGHT/2));const n={id:id(),name:'new_function()',responsibility:'',input:'',changes:'',unchanged:'',dependencies:'',preconditions:'',contract:'',type:'control',x:x+Math.random()*30,y:y+Math.random()*30};nodes.push(n);selected=n.id;selectedEdge=null;connectMode=false;connectFrom=null;scheduleSave();renderAll();$('field-name')?.focus();toast('新しい関数を作成しました')};$('connectBtn').onclick=()=>{connectMode=!connectMode;connectFrom=null;selectedEdge=null;renderAll()};$('layoutBtn').onclick=layout;$('zoomIn').onclick=()=>setZoom(zoom+.15);$('zoomOut').onclick=()=>setZoom(zoom-.15);$('fitBtn').onclick=fit;
$('exportBtn').onclick=()=>{const data=JSON.stringify({format:'function-canvas',version:1,nodes,edges},null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='function-canvas.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('JSONを保存しました')};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async ev=>{const file=ev.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!Array.isArray(obj.nodes)||!Array.isArray(obj.edges)||obj.nodes.length>400)throw new Error('JSONの形式が正しくありません');const ids=new Set();for(const n of obj.nodes){if(!n||typeof n.id!=='string'||typeof n.name!=='string'||typeof n.x!=='number'||typeof n.y!=='number'||ids.has(n.id)||!Number.isFinite(n.x)||!Number.isFinite(n.y))throw new Error('ノードの形式が不正です');ids.add(n.id);n.x=Math.max(0,Math.min(WORLD_W-WIDTH,n.x));n.y=Math.max(0,Math.min(WORLD_H-HEIGHT,n.y));n.type=['control','output','state'].includes(n.type)?n.type:'control'}nodes=obj.nodes;edges=obj.edges.filter(e=>e&&ids.has(e.from)&&ids.has(e.to)&&e.from!==e.to).map(e=>({id:typeof e.id==='string'?e.id:id(),from:e.from,to:e.to,kind:e.kind==='state'?'state':'call'}));selected=null;selectedEdge=null;connectMode=false;connectFrom=null;persist();renderAll();setTimeout(fit,30);toast('JSONを読み込みました')}catch(err){alert('読み込めませんでした：'+err.message)}ev.target.value=''};$('resetBtn').onclick=()=>{if(!confirm('現在のマップをサンプルに戻しますか？ 保存していない変更は失われます。'))return;const s=sample();nodes=s.nodes;edges=s.edges;selected=null;selectedEdge=null;connectMode=false;connectFrom=null;persist();renderAll();setTimeout(fit,30)};
$('canvas').addEventListener('click',e=>{if(e.target===$('canvas')||e.target===$('world')||e.target===$('shell')||e.target===$('nodeLayer')||e.target===$('edges')){selected=null;selectedEdge=null;renderAll()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&connectMode){connectMode=false;connectFrom=null;renderAll()}if((e.key==='Delete'||e.key==='Backspace')&&selectedEdge&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){edges=edges.filter(x=>x.id!==selectedEdge);selectedEdge=null;scheduleSave();renderAll()}});
load();renderAll();setZoom(.8);setTimeout(fit,120);
})();
